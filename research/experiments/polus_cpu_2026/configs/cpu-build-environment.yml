# Candidate, not a solved lockfile. Create on linux-ppc64le only.
name: polus-gnn-cpu-build
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - pip<25
  - setuptools=68
  - wheel
  - gcc_linux-ppc64le=10
  - gxx_linux-ppc64le=10
  - cmake=3.26
  - ninja
  - git
  - make
  - pkg-config
  - openblas
  - numpy=1.24
  - scipy=1.10
  - pandas=1.5
  - scikit-learn=1.2
  - pyyaml=6
  - typing_extensions
  - filelock
  - sympy=1.12
  - networkx=3.1
  - jinja2
  - requests
  - tqdm
  - pyparsing
  - psutil
  - six
  - packaging
