base: configs/experiments/kaggle_pilot/base.yaml
dataset: cora
model:
  name: gcn
  num_layers: 3
  hidden_channels: 32
  dropout: 0.5
run:
  experiment_name: local_canonical_cora_gcn_l3_h32_seed303
  output_dir: ${GNN_ARTIFACT_ROOT}/local-cpu-20261025/raw/results/seed_303/cora_gcn_l3_h32
  seed: 303
pruning:
  methods:
  - random
  - global_magnitude
  - snip
  - grasp
  - group_lasso
  - adaptive_layerwise
  - q_learning_tabular
  sparsity_levels:
  - 0.3
  - 0.5
  structured: true
  finetune_enabled: false
  reg_strength: 0.0001
adaptive_pruning:
  step_prune_ratio: 0.1
  max_steps: 10
  max_accuracy_drop: 0.07
  min_channels_per_layer: 4
  reward:
    alpha: 0.4
    beta: 0.2
    gamma: 0.4
q_learning:
  allow_nonmonotonic_layer_order: true
  structural_pruning_mode: local
  episodes: 30
  max_steps: 20
  step_prune_ratios:
  - 0.05
  - 0.1
  min_channels_per_layer: 4
  max_accuracy_drop: 0.07
  alpha: 0.3
  gamma: 0.9
  epsilon_start: 0.4
  epsilon_end: 0.05
  epsilon_decay: 0.95
  reward:
    alpha: 0.4
    beta: 0.2
    gamma: 0.4
  terminal_reward:
    target_tolerance: 0.05
    gap_scale: 0.25
    early_stop_max_penalty: 0.08
    no_valid_max_penalty: 0.12
    target_reached_bonus: 0.1
    accuracy_failure_penalty: 0.1
    stop_bonus: 0.0
logging:
  show_progress: true
data:
  root: ${GNN_REPO_ROOT}/data
