base: base/default
dataset: pubmed
model: graphsage
preset: fast_debug

model:
  name: graphsage
  num_layers: 3
  hidden_channels: 32

run:
  experiment_name: rl_qlearning_pubmed_graphsage_l3_h32
  output_dir: runs/pubmed_stress_sweep/rl_qlearning_pubmed_graphsage_l3_h32
  seed: 42

device:
  device: auto

training:
  epochs: 30
  early_stopping_patience: 10

pruning:
  methods: [q_learning_tabular]
  target_sparsity: 0.8
  sparsity_levels: [0.8]
  structured: true
  finetune_enabled: false

q_learning:
  episodes: 30
  max_steps: 20
  step_prune_ratios: [0.05, 0.10]
  max_accuracy_drop: 0.05
  reward:
    alpha: 0.4
    beta: 0.2
    gamma: 0.4
