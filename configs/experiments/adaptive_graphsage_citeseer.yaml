base: base/default
dataset: citeseer
model: graphsage
preset: fast_debug

run:
  experiment_name: adaptive_graphsage_citeseer
  output_dir: runs/adaptive_graphsage_citeseer

model:
  name: graphsage
  num_layers: 3
  hidden_channels: 64

training:
  epochs: 40
  early_stopping_patience: 10

pruning:
  methods: [random, global_magnitude, layerwise_magnitude, adaptive_layerwise]
  sparsity_levels: [0.5, 0.9]
  structured: true
  finetune_epochs: 5

adaptive_pruning:
  step_prune_ratio: 0.1
  max_steps: 10
  max_accuracy_drop: 0.05
  min_channels_per_layer: 4
  reward:
    alpha: 0.4
    beta: 0.2
    gamma: 0.4

logging:
  show_progress: true
