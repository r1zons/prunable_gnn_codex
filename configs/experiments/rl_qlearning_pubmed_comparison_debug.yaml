base: base/default
dataset: pubmed
model: graphsage
preset: fast_debug

model:
  name: graphsage
  num_layers: 2
  hidden_channels: 64

run:
  experiment_name: rl_qlearning_pubmed_comparison_debug
  output_dir: runs/rl_qlearning_pubmed_comparison_debug
  seed: 42

device:
  device: auto

training:
  epochs: 30

pruning:
  methods: [random, global_magnitude, layerwise_magnitude, snip, q_learning_tabular]
  sparsity_levels: [0.5, 0.7]
  target_sparsity: 0.7
  structured: true
  finetune_enabled: false

q_learning:
  episodes: 30
  max_steps: 16
  step_prune_ratios: [0.05, 0.10]
  max_accuracy_drop: 0.03
  alpha: 0.4
  gamma: 0.4
  epsilon_start: 0.4
  epsilon_end: 0.05
  epsilon_decay: 0.95
  reward:
    alpha: 0.4
    beta: 0.2
    gamma: 0.4
