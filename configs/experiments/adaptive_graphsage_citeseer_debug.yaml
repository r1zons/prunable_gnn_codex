base: base/default
dataset: citeseer
model: graphsage
preset: fast_debug

run:
  experiment_name: adaptive_graphsage_citeseer_debug
  output_dir: runs/adaptive_graphsage_citeseer_debug

model:
  name: graphsage
  num_layers: 2
  hidden_channels: 64

training:
  epochs: 5
  early_stopping_patience: 3

pruning:
  methods: [adaptive_layerwise]
  sparsity_levels: [0.5]
  structured: true
  finetune_epochs: 3

adaptive_pruning:
  step_prune_ratio: 0.1
  max_steps: 10
  max_accuracy_drop: 0.05
  min_channels_per_layer: 4
  reward:
    alpha: 0.4
    beta: 0.2
    gamma: 0.4

logging:
  show_progress: true
