base: base/default
dataset: pubmed
model: graphsage
preset: fast_debug

model:
  name: graphsage
  num_layers: 2
  hidden_channels: 64

run:
  experiment_name: rl_qlearning_pubmed_debug
  output_dir: runs/rl_qlearning_pubmed_debug
  seed: 42

device:
  device: auto

pruning:
  methods: [q_learning_tabular]
  target_sparsity: 0.7
  sparsity_levels: [0.7]
  structured: true
  finetune_enabled: false

q_learning:
  episodes: 20
  max_steps: 8
  step_prune_ratios: [0.05, 0.10]
  min_channels_per_layer: 4
  alpha: 0.3
  gamma: 0.9
  epsilon_start: 0.4
  epsilon_end: 0.05
  epsilon_decay: 0.95
  reward:
    alpha: 0.4
    beta: 0.2
    gamma: 0.4
