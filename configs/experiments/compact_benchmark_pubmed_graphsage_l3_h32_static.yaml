base: base/default
dataset: pubmed
model: graphsage
preset: fast_debug

model:
  name: graphsage
  num_layers: 3
  hidden_channels: 32

run:
  experiment_name: compact_benchmark_pubmed_graphsage_l3_h32_static
  output_dir: runs/compact_pruning_benchmark/compact_benchmark_pubmed_graphsage_l3_h32_static
  seed: 42

device:
  device: auto

training:
  epochs: 30
  early_stopping_patience: 10

pruning:
  methods: [random, global_magnitude, layerwise_magnitude, snip]
  sparsity_levels: [0.1, 0.3, 0.5, 0.7, 0.8, 0.9]
  structured: true
  finetune_enabled: false
