base: base/default
dataset: cora
model: gcn
preset: fast_debug

model:
  name: gcn
  num_layers: 2
  hidden_channels: 64

run:
  experiment_name: compact_benchmark_cora_gcn_l2_h64_static
  output_dir: runs/compact_pruning_benchmark/compact_benchmark_cora_gcn_l2_h64_static
  seed: 42

device:
  device: auto

training:
  epochs: 30
  early_stopping_patience: 10

pruning:
  methods: [random, global_magnitude, layerwise_magnitude, snip]
  sparsity_levels: [0.1, 0.3, 0.5, 0.7, 0.8, 0.9]
  structured: true
  finetune_enabled: false
