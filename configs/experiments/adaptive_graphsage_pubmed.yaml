base: base/default
dataset: pubmed
model: graphsage
preset: standard

run:
  experiment_name: adaptive_graphsage_pubmed
  output_dir: runs/adaptive_graphsage_pubmed

model:
  name: graphsage
  num_layers: 2
  hidden_channels: 128

training:
  epochs: 120
  early_stopping_patience: 20

pruning:
  methods: [random, global_magnitude, layerwise_magnitude, adaptive_layerwise]
  sparsity_levels: [0.5, 0.9]
  structured: true
  finetune_epochs: 20

adaptive_pruning:
  step_prune_ratio: 0.1
  max_steps: 10
  max_accuracy_drop: 0.05
  min_channels_per_layer: 4
  reward:
    alpha: 0.4
    beta: 0.2
    gamma: 0.4
